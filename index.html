<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estande de Troféus PES</title>
<style>
  :root {
    --bg: #111827; --panel: #1f2937; --muted: #9ca3af; --accent: #f59e0b;
    --border: #374151; --text-main: #f3f4f6; --color-neno: #3b82f6;
    --color-kazimiro: #22c55e; --color-keirrison: #ef4444;
  }
  * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
  body { margin: 0; background-color: var(--bg); color: var(--text-main); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; padding: 24px; min-height: 100vh; }
  header { max-width: 900px; margin: 0 auto 24px auto; text-align: center; }
  header h1 { margin: 0; font-size: 24px; font-weight: 800; }
  #rankingTrofeus { max-width: 900px; margin: 0 auto 24px auto; padding: 10px 0; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; }
  .rank-pill { padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 16px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); display: inline-flex; align-items: center; gap: 10px; }
  .rank-pill.player-neno { background-color: var(--color-neno); }
  .rank-pill.player-kazimiro { background-color: var(--color-kazimiro); }
  .rank-pill.player-keirrison { background-color: var(--color-keirrison); }
  .rank-pill.retired { opacity: 0.75; }
  .status-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,0.25); text-shadow: none; }
  .status-tag.active::before { content: '● '; color: #bbf7d0; }
  .status-tag.retired::before { content: '● '; color: #d1d5db; }
  #viewFilters { max-width: 900px; margin: 0 auto 16px auto; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .view-filter-btn { background-color: var(--panel); color: var(--muted); border: 1px solid var(--border); font-weight: 600; padding: 8px 16px; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; font-size: 14px; }
  .view-filter-btn:hover { background-color: #374151; color: var(--text-main); }
  .view-filter-btn.active { background-color: var(--accent); color: var(--bg); border-color: var(--accent); }
  .sub-filters-container { display: none; max-width: 900px; margin: 0 auto 20px auto; padding: 10px; background-color: var(--panel); border: 1px solid var(--border); border-radius: 10px; justify-content: center; flex-wrap: wrap; gap: 8px; }
  .month-shortcut-btn { background-color: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
  .month-shortcut-btn:hover { color: var(--text-main); border-color: var(--accent); }
  .month-shortcut-btn.active { background-color: var(--color-neno); border-color: var(--color-neno); color: white; }
  #filtros { max-width: 900px; margin: 0 auto 24px auto; display: flex; gap: 12px; flex-wrap: wrap; }
  #filtros select, #filtros input { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 14px; outline-offset: 4px; transition: border-color 0.2s; flex-grow: 1; }
  #filtros select:focus, #filtros input:focus { border-color: var(--accent); }
  #galeriaEstande { max-width: 900px; margin: 0 auto 30px auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .trofeuCard { background: var(--panel); padding: 16px; border-radius: 12px; border: 1px solid var(--border); text-align: center; position: relative; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .trofeuCard:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
  .trofeu-icon { font-size: 4.5rem; line-height: 1; height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 70%); border-radius: 8px; }
  .trofeuCard h3 { margin: 5px 0 2px 0; font-weight: 700; font-size: 18px; color: var(--text-main); }
  .trofeuCard p { margin: 2px 0; font-size: 14px; color: var(--muted); min-height: 20px; }
  .player-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; margin-top: 12px; border: 1px solid; }
  .player-neno { background-color: #1e3a8a; border-color: var(--color-neno); color: #dbeafe; }
  .player-kazimiro { background-color: #166534; border-color: var(--color-kazimiro); color: #dcfce7; }
  .player-keirrison { background-color: #991b1b; border-color: var(--color-keirrison); color: #fee2e2; }
  .emptyMsg { text-align: center; color: var(--muted); font-style: italic; grid-column: 1 / -1; padding: 20px 0; }

  /* ===== Abas e Perfis ===== */
  #mainTabs { max-width: 900px; margin: 0 auto 20px auto; display: flex; gap: 8px; justify-content: center; }
  .tab-btn { background: var(--panel); color: var(--muted); border: 1px solid var(--border); font-weight: 700; padding: 10px 22px; cursor: pointer; border-radius: 999px; font-size: 14px; transition: all 0.2s ease; }
  .tab-btn:hover { color: var(--text-main); }
  .tab-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .rank-pill[data-player] { cursor: pointer; }
  .rank-pill[data-player]:hover { filter: brightness(1.1); }

  #viewPerfis { max-width: 900px; margin: 0 auto 30px auto; }
  #perfilSeletor { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .profile-pick { border-width: 2px; border-style: solid; border-radius: 999px; padding: 8px 22px; font-weight: 700; font-size: 14px; cursor: pointer; opacity: 0.55; transition: all 0.2s ease; }
  .profile-pick:hover { opacity: 0.85; }
  .profile-pick.active { opacity: 1; box-shadow: 0 0 0 3px rgba(255,255,255,0.12); }

  .profile-head { background: var(--panel); border: 1px solid var(--border); border-left: 6px solid var(--pcolor); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .profile-head h2 { margin: 0; font-size: 26px; font-weight: 800; }
  .profile-head .status-tag { background: rgba(255,255,255,0.1); }

  .profile-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .profile-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px; text-align: center; }
  .tile-icon { font-size: 22px; display: block; }
  .tile-value { font-size: 26px; font-weight: 800; display: block; margin: 4px 0 2px 0; }
  .tile-label { font-size: 12px; color: var(--muted); }

  .profile-block { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .profile-block h3 { margin: 0 0 12px 0; font-size: 16px; }
  .profile-note { font-size: 12px; color: var(--muted); margin: 10px 0 0 0; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .stat-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .stat-cell span { font-size: 12px; color: var(--muted); }
  .stat-cell strong { font-size: 20px; }
  .stat-input { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); padding: 6px; font-size: 16px; text-align: center; }

  .entry-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .entry-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .entry-main { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .entry-chip { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .entry-emoji { font-size: 20px; }
  .entry-list li.entry-empty { color: var(--muted); font-style: italic; justify-content: center; }
  .entry-del { background: #4b5563; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; flex-shrink: 0; font-size: 16px; line-height: 1; }
  .entry-del:hover { background: #ef4444; }

  .list-add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .list-add input { flex: 1 1 140px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text-main); font-size: 14px; }
  .list-add input:focus, .stat-input:focus { border-color: var(--accent); outline: none; }
</style>
</head>

function emptyProfile() {
  return {
    stats: { vitorias: 0, empates: 0, derrotas: 0, golsPro: 0 },
    records: [], teams: [], championships: []
  };
}

function normalizeProfiles() {
  if (!profiles || typeof profiles !== 'object' || Array.isArray(profiles)) profiles = {};
  Object.keys(PLAYERS).forEach(name => {
    const base = emptyProfile();
    const p = profiles[name] || {};
    const stats = { ...base.stats };
    Object.keys(stats).forEach(k => { stats[k] = num(p.stats && p.stats[k]); });
    profiles[name] = {
      stats,
      records: Array.isArray(p.records) ? p.records : [],
      teams: Array.isArray(p.teams) ? p.teams : [],
      championships: Array.isArray(p.championships) ? p.championships : []
    };
  });
}

function isProfilesEmpty() {
  const empty = JSON.stringify(emptyProfile());
  return Object.keys(PLAYERS).every(n => JSON.stringify(profiles[n]) === empty);
}

function num(v) {
  const n = parseInt(v, 10);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function showTab(tab) {
  document.getElementById('viewEstande').style.display = tab === 'perfis' ? 'none' : 'block';

  document.querySelectorAll('#mainTabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'perfis') renderProfiles();
}

function openProfile(name) {
  if (!PLAYERS[name]) return;
  currentProfileName = name;
  showTab('perfis');
}

function initProfiles() {
  document.getElementById('mainTabs').addEventListener('click', e => {
    const b = e.target.closest('.tab-btn');
    if (b) showTab(b.dataset.tab);
  });

  document.getElementById('rankingTrofeus').addEventListener('click', e => {
    const pill = e.target.closest('.rank-pill');
    if (pill && pill.dataset.player) openProfile(pill.dataset.player);
  });

  const view = document.getElementById('viewPerfis');

  view.addEventListener('click', e => {
    const pick = e.target.closest('.profile-pick');
    if (pick) { currentProfileName = pick.dataset.player; renderProfiles(); return; }
    if (!CAN_EDIT) return;

    if (e.target.closest('#importProfilesBtn')) { document.getElementById('importProfilesFile').click(); return; }

    const addBtn = e.target.closest('.list-add-btn');
    if (addBtn) {
      const key = addBtn.dataset.list;
      const cfg = PROFILE_LISTS[key];
      const box = addBtn.closest('.list-add');
      const entry = {};
      cfg.fields.forEach(f => {
        const raw = box.querySelector(`[data-field="${f.k}"]`).value.trim();
        entry[f.k] = f.type === 'number' ? String(num(raw)) : raw;
      });
      if (!entry[cfg.fields[0].k]) {
        alert('Preencha pelo menos o campo "' + cfg.fields[0].label + '".');
        return;
      }
      profiles[currentProfileName][key].push(entry);
      persistProfiles();
      renderProfiles();
      return;
    }

    const delBtn = e.target.closest('.entry-del');
    if (delBtn) {
      if (confirm('Remover este registro?')) {
        profiles[currentProfileName][delBtn.dataset.list].splice(parseInt(delBtn.dataset.index, 10), 1);
        persistProfiles();
        renderProfiles();
      }
    }
  });

  view.addEventListener('change', e => {
    if (!CAN_EDIT) return;
    if (e.target.id === 'importProfilesFile') {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data || typeof data.profiles !== 'object') throw new Error('formato');
          if (confirm('Isso irá substituir os perfis atuais (troféus não são alterados). Continuar?')) {
            profiles = data.profiles;
            normalizeProfiles();
            persistProfiles();
            renderAll();
            alert('Perfis importados com sucesso!');
          }
        } catch (err) { alert('Erro: arquivo de perfis inválido.'); }
      };
      reader.readAsText(file);
      return;
    }
    const input = e.target.closest('[data-stat]');
    if (input) {
      profiles[currentProfileName].stats[input.dataset.stat] = num(input.value);
      persistProfiles();
      renderProfiles();
    }
  });

  view.addEventListener('keydown', e => {
    if (CAN_EDIT && e.key === 'Enter' && e.target.matches('.list-add input')) {
      e.preventDefault();
      e.target.closest('.list-add').querySelector('.list-add-btn').click();
    }
  });
}

    itemsFiltrados = itemsFiltrados.filter(item => item.type === currentViewFilter);
  }

  const filtroComp = document.getElementById('filtroCompetidor').value;
  const filtroBusca = document.getElementById('filtroBusca').value.trim().toLowerCase();

  if (filtroComp) {
    itemsFiltrados = itemsFiltrados.filter(item => item.player === filtroComp);
  }
  if (filtroBusca) {
    itemsFiltrados = itemsFiltrados.filter(item => {
      const searchString = [item.name, item.competition, item.month, item.year, item.desc].join(' ').toLowerCase();
      return searchString.includes(filtroBusca);
    });
  }

  if (currentViewFilter === 'recent') {
    itemsFiltrados.sort((a, b) => b.id - a.id);
  } else {
    itemsFiltrados.sort((a, b) => (b.year || 0) - (a.year || 0) || (monthOrder[b.month] || 0) - (monthOrder[a.month] || 0) || b.id - a.id);
  }

  if (currentViewFilter === 'by-month') {
    monthSubFiltersContainer.style.display = 'flex';
    const allMonthsInView = [...new Set(items.filter(i => i.type === 'trofeu' && i.month).map(i => i.month))];
    allMonthsInView.sort((a, b) => monthOrder[b] - monthOrder[a]);

    const allBtn = document.createElement('button');
    allBtn.className = 'month-shortcut-btn';
    allBtn.textContent = 'Ver Todos os Meses';
    allBtn.dataset.month = 'all';
    if (!selectedMonthFilter) allBtn.classList.add('active');
    monthSubFiltersContainer.appendChild(allBtn);

    allMonthsInView.forEach(month => {
      const button = document.createElement('button');
      button.className = 'month-shortcut-btn';
      button.textContent = month;
      button.dataset.month = month;
      if (month === selectedMonthFilter) button.classList.add('active');
      monthSubFiltersContainer.appendChild(button);
    });
  }

  if (itemsFiltrados.length === 0) {
    container.innerHTML = '<p class="emptyMsg">Nenhum item encontrado.</p>';
    return;
  }

  itemsFiltrados.forEach(item => {
    const card = document.createElement('div');
    card.className = 'trofeuCard';
    const playerClass = `player-${item.player.toLowerCase().replace('á', 'a')}`;
    const isTrofeu = item.type === 'trofeu';
    const competitionText = isTrofeu ? `${escapeHtml(item.competition)} ${item.month ? escapeHtml(item.month) + '/' : ''}${item.year ? escapeHtml(item.year) : ''}` : 'Prêmio Individual';
    const icon = escapeHtml(item.emoji) || (isTrofeu ? '🏆' : '⭐');
    card.innerHTML = `
      <div class="trofeu-icon">${icon}</div>
      <h3>${escapeHtml(item.name)}</h3>
      <p>${competitionText}</p>
      <p style="font-size:12px; font-style:italic;">${escapeHtml(item.desc)}</p>
      <span class="player-badge ${playerClass}">${escapeHtml(item.player)}</span>
    `;
    container.appendChild(card);
  });
}

function renderAll() { renderRanking(); renderGaleria(); renderProfiles(); }

document.addEventListener('DOMContentLoaded', () => {
  const viewFiltersContainer = document.getElementById('viewFilters');
  viewFiltersContainer.addEventListener('click', (e) => {
    const button = e.target.closest('.view-filter-btn');
    if (button && !button.classList.contains('active')) {
      currentViewFilter = button.dataset.filter;
      selectedMonthFilter = null;
      viewFiltersContainer.querySelector('.active').classList.remove('active');
      button.classList.add('active');
      renderGaleria();
    }
  });

  document.getElementById('monthSubFilters').addEventListener('click', (e) => {
    const button = e.target.closest('.month-shortcut-btn');
    if (button) {
      const month = button.dataset.month;
      selectedMonthFilter = (month === 'all') ? null : month;
      renderGaleria();
    }
  });

  document.getElementById('filtroCompetidor').addEventListener('change', renderGaleria);
  document.getElementById('filtroBusca').addEventListener('input', renderGaleria);

  renderAll();
});
</script>
</body>
</html>
